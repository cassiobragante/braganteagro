<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bragante Agro</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a3d1d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a3d1d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .container-principal {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: #f8fafc;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Telas flutuantes integradas offline */
        .tela-sistema-extra {
            display: none;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: white;
        }

        /* Botão Flutuante Superior Esquerdo - Voltar para Pedidos */
        #btn-voltar-pedidos {
            display: none;
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: #c62828;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 11px;
            font-weight: 800;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container-principal">
        
        <button id="btn-voltar-pedidos" onclick="fecharTelasExtras()">← Voltar aos Pedidos</button>

        <iframe src="BackupSistemaDefinitivo.html" id="iframe-pedidos"></iframe>

        <div id="tela-racao" class="tela-sistema-extra">
            <iframe src="FormularioRacaoDefinitivo.html"></iframe>
        </div>

        <div id="tela-precos" class="tela-sistema-extra">
            <iframe src="precos.html"></iframe>
        </div>

    </div>

    <script>
        // Configuração Firebase (Apenas para manter a estrutura se necessário)
        const firebaseConfig = {
            apiKey: "AIzaSyCiQh8MEy5SlPCkS8psN0EQ59W2PLKXo8s",
            authDomain: "bragante-agro.firebaseapp.com",
            databaseURL: "https://bragante-agro-default-rtdb.firebaseio.com",
            projectId: "bragante-agro",
            storageBucket: "bragante-agro.firebasestorage.app",
            messagingSenderId: "445413217691",
            appId: "1:445413217691:web:e9b37451c2689a007e7d3e"
        };
        firebase.initializeApp(firebaseConfig);

        // Registro de Service Worker para Persistência Offline Absoluta
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Offline Bragante: Ativado!'))
                    .catch(err => console.log('Erro ao registrar SW:', err));
            });
        }

        // --- FUNÇÕES DE NAVEGAÇÃO ---
        function abrirRacao() {
            document.getElementById('tela-racao').style.display = 'block';
            alternarBotoes(false);
        }

        function abrirPrecos() {
            document.getElementById('tela-precos').style.display = 'block';
            alternarBotoes(false);
        }

        function fecharTelasExtras() {
            document.getElementById('tela-racao').style.display = 'none';
            document.getElementById('tela-precos').style.display = 'none';
            alternarBotoes(true);
        }

        function alternarBotoes(mostrar) {
            const displayBack = mostrar ? 'none' : 'flex';
            document.getElementById('btn-voltar-pedidos').style.display = displayBack;
        }

        // Ouvinte de mensagens para comunicação nativa com o iframe de Pedidos
        window.addEventListener('message', function(event) {
            if (event.data === 'abrirJanelaRacao') {
                abrirRacao();
            } else if (event.data === 'abrirJanelaPrecos') {
                abrirPrecos();
            }
        });
    </script>
</body>
</html>
